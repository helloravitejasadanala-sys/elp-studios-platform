# ELP Studios — PicPeak all-in-one (SQLite) demo stack
# Prefer this over rebuilding a gallery. Official image: picpeak/aio:stable
# Docs: https://docs.picpeak.app/deployment/single-container

services:
  picpeak:
    image: picpeak/aio:stable
    container_name: elp-picpeak
    restart: unless-stopped
    ports:
      - "${PICPEAK_PORT:-3000}:3000"
    volumes:
      - picpeak-data:/data
    environment:
      # First-boot admin only (ignored once an admin exists). Change via UI then remove from .env for production.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@elp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BRAND_TITLE: ${BRAND_TITLE:-ELP Studios Galleries}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-Client photo galleries for Mini Momentz, Katha Films, and Tattva Weddings.}
      # Direct LAN/demo access — no reverse proxy hop
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Optional: pin public origin for gallery links (set when behind HTTPS / Tunnel)
      # FRONTEND_URL: ${FRONTEND_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Optional Studio Console (tabbed create, brands, WhatsApp).
  # Does not replace PicPeak. Does not mount or rewrite elp-picpeak-data.
  # Start only this service: docker compose up -d studio-console
  studio-console:
    image: python:3.12-alpine
    container_name: elp-studio-console
    restart: unless-stopped
    working_dir: /app
    command: ["python", "server.py"]
    ports:
      - "${STUDIO_PORT:-3080}:3080"
    volumes:
      # Compose lives in apps/gallery. Do not mount elp-picpeak-data here.
      # /gallery/elp_lib.py is only one level under /, same as the live Windows install.
      - .:/gallery:ro
      - ../studio-console:/app:ro
      - ../../brands:/brands:ro
      - ../../styles:/styles:ro
    environment:
      STUDIO_BIND: 0.0.0.0
      STUDIO_PORT: 3080
      PICPEAK_ORIGIN: http://picpeak:3000
      PICPEAK_PUBLIC_ORIGIN: ${PICPEAK_PUBLIC_ORIGIN:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@elp.local}
      ELP_REPO_ROOT: /
      ELP_GALLERY_DIR: /gallery
      ELP_BRANDS_DIR: /brands
      ELP_STYLES_DIR: /styles
      PYTHONPATH: /gallery
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - picpeak

volumes:
  picpeak-data:
    name: elp-picpeak-data
